<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Klantdashboard PoortEijk ZZP</title>
<link rel="icon" href="assets/logo-icoon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app"></div>
<template id="tpl">
<sc-if value="{{showAuth}}" hint-placeholder-val="{{ false }}">
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
  <form class="card" style="width: 100%; max-width: 400px; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box" onSubmit="{{authSubmit}}">
    <img src="assets/logo.png" alt="PoortEijk ZZP" style="height: 40px; width: auto; align-self: flex-start">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 20px; font-weight: 800">{{authTitle}}</span>
      <span style="font-size: 13px; color: #5E5E5E">{{authSub}}</span>
    </div>
    <sc-if value="{{authAskEmail}}" hint-placeholder-val="{{ true }}">
      <label class="field">E-mailadres
        <input type="email" autocomplete="username" value="{{auth.email}}" onChange="{{onAuth.email}}">
      </label>
    </sc-if>
    <sc-if value="{{authAskPw}}" hint-placeholder-val="{{ true }}">
      <label class="field">{{authPwLabel}}
        <input type="password" autocomplete="{{authPwAuto}}" value="{{auth.pw}}" onChange="{{onAuth.pw}}">
      </label>
    </sc-if>
    <sc-if value="{{authAskPw2}}" hint-placeholder-val="{{ false }}">
      <label class="field">Herhaal wachtwoord
        <input type="password" autocomplete="new-password" value="{{auth.pw2}}" onChange="{{onAuth.pw2}}">
      </label>
    </sc-if>
    <sc-if value="{{authShowQr}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <img src="{{mfaQr}}" alt="QR-code voor de authenticator-app" style="width: 200px; height: 200px; border: 1px solid #E4E2DF; border-radius: 10px; background: #fff">
        <span style="font-size: 12px; color: #5E5E5E; text-align: center">Lukt scannen niet? Voer in de app deze sleutel handmatig in:</span>
        <code style="font-size: 13px; font-weight: 700; word-break: break-all; text-align: center">{{mfaSecret}}</code>
      </div>
    </sc-if>
    <sc-if value="{{authAskCode}}" hint-placeholder-val="{{ false }}">
      <label class="field">Code uit de app
        <input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" value="{{code}}" onInput="{{onCode}}" style="font-size: 22px; letter-spacing: 0.3em; text-align: center">
      </label>
    </sc-if>
    <sc-if value="{{authAskOnth}}" hint-placeholder-val="{{ true }}">
      <label class="check" style="font-size: 13px"><input type="checkbox" checked="{{onth}}" onChange="{{onOnth}}">Dit apparaat 30 dagen onthouden</label>
    </sc-if>
    <sc-if value="{{hasAuthMsg}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="font-size: 13px; font-weight: 600; border-radius: 8px; padding: 10px 12px; {{authMsgStyle}}">{{authMsg}}</div>
    </sc-if>
    <button type="submit" class="btn primary" style="justify-content: center">{{authBtn}}</button>
    <sc-if value="{{authCanForgot}}" hint-placeholder-val="{{ true }}">
      <button type="button" class="btn" style="border: 0; justify-content: center; color: #8A3F00" onClick="{{authForgot}}">{{authForgotLabel}}</button>
    </sc-if>
  </form>
</div>
</sc-if>

<sc-if value="{{showLoading}}" hint-placeholder-val="{{ false }}">
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #5E5E5E">{{loadingText}}</div>
</sc-if>

<sc-if value="{{showApp}}" hint-placeholder-val="{{ true }}">
<div style="min-height: 100vh; display: flex">
  <nav class="rail" aria-label="Hoofdmenu">
    <img class="raillogo" src="assets/logo-icoon.png" alt="PoortEijk ZZP">
    <button type="button" class="{{navWerkCls}}" onClick="{{goWerk}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4h6v4h-6zM4 20h6v-3H4z"></path></svg>Vandaag</button>
    <button type="button" class="{{navKlantCls}}" onClick="{{goKlanten}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M19 14.5c1.4.9 2.2 2.8 2.5 5.5"></path></svg>Overzicht</button>
    <button type="button" class="{{navJwCls}}" onClick="{{goJw}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5M10 13h6M10 17h6"></path></svg>Jaarwerk</button>
    <button type="button" class="{{navSelCls}}" onClick="{{goSel}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8z"></path></svg>Selecties</button>
    <div style="flex: 1 1 auto"></div>
    <sc-if value="{{isBeheer}}" hint-placeholder-val="{{ true }}">
      <button type="button" class="{{navBeheerCls}}" onClick="{{goBeheer}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>Instellingen</button>
    </sc-if>
  </nav>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">

  <header style="background: #ffffff; border-bottom: 1px solid #E4E2DF">
    <div style="max-width: 1440px; margin: 0 auto; padding: 10px 24px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
      <span class="kopnaam">PoortEijk ZZP <span>Klantdashboard</span></span>
      <div style="flex: 1 1 auto"></div>
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px">
        <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #5E5E5E">Jaar
          <select aria-label="Kies jaar" value="{{jaarSel}}" onChange="{{onJaar}}" style="border: 1px solid #D0CCC6; border-radius: 8px; font-size: 14px; font-weight: 700; min-height: 34px; padding: 0 6px; background: #fff; color: #2B2B2B">
            <sc-for list="{{jaren}}" as="jy" hint-placeholder-count="1">
              <option value="{{jy.v}}">{{jy.l}}</option>
            </sc-for>
          </select>
        </label>
        <sc-if value="{{isDemo}}" hint-placeholder-val="{{ true }}">
          <span class="mini o" style="font-size: 12px">Demo, verzonnen klanten</span>
          <span style="font-size: 12px; font-weight: 600; color: #5E5E5E">Bekijk als</span>
          <div style="display: inline-flex; gap: 2px; padding: 3px; background: #F1EFEC; border-radius: 8px">
            <sc-for list="{{roles}}" as="ro" hint-placeholder-count="4">
              <button type="button" class="{{ro.cls}}" onClick="{{ro.pick}}">{{ro.l}}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">
          <span class="{{connCls}}" title="{{connTitle}}">{{connLabel}}</span>
          <span style="font-size: 13px; font-weight: 700">{{userLabel}}</span>
          <button type="button" class="btn" style="min-height: 34px" onClick="{{logout}}">Uitloggen</button>
        </sc-if>
        <span class="av" style="width: 34px; height: 34px; font-size: 14px">{{roleInitial}}</span>
      </div>
    </div>
  </header>

  <main style="max-width: 1440px; width: 100%; margin: 0 auto; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
  <sc-if value="{{hasSaveErr}}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="background: #FFF2E5; border: 1px solid #FFBF80; color: #8A3F00; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600">{{saveErr}}</div>
  </sc-if>

  <sc-if value="{{pageWerk}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 16px">
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 320px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">{{werkTitel}}</h1>
        <span style="font-size: 13px; color: #5E5E5E">{{werkSub}}</span>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #D0CCC6; border-radius: 8px; padding: 0 4px 0 12px; min-height: 42px; font-size: 13px; font-weight: 600; color: #5E5E5E">Werkvoorraad van
        <select aria-label="Werkvoorraad van" value="{{werkWie}}" onChange="{{onWerkWie}}" style="border: 0; outline: none; font-size: 14px; font-weight: 600; min-height: 40px; background: transparent; color: #2B2B2B">
          <option value="Jeroen">JB</option>
          <option value="Gea">GW</option>
          <option value="Marco">MK</option>
          <option value="Yassir">YO</option>
          <option value="alle">Iedereen</option>
        </select>
      </label>
      <button type="button" class="btn dark" onClick="{{exportWerk}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
        Exporteer naar Excel
      </button>
    </div>

    <div class="todobalk">
      <div class="tdtot"><b>{{todoTotaal}}</b><span>taken nog te doen</span></div>
      <sc-for list="{{todoTegels}}" as="tg" hint-placeholder-count="7"><div class="{{tg.cls}}"><b>{{tg.n}}</b><span>{{tg.l}}</span></div></sc-for>
    </div>
    <sc-if value="{{toonTeam}}" hint-placeholder-val="{{ true }}">
      <section class="card" style="overflow: hidden">
        <div style="padding: 14px 16px; border-bottom: 1px solid #E4E2DF; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap">
          <span style="font-size: 15px; font-weight: 800">Team in één oogopslag</span>
          <span style="font-size: 12px; color: #5E5E5E">aantal klanten per collega · klik op een naam voor diens werkvoorraad</span>
        </div>
        <div style="overflow-x: auto">
          <div class="teamgrid">
            <div class="hcell">Collega</div>
            <sc-for list="{{teamKop}}" as="tk" hint-placeholder-count="7">
              <div class="hcell">{{tk.l}}</div>
            </sc-for>
            <sc-for list="{{team}}" as="tm" hint-placeholder-count="4">
              <div class="{{tm.cls}}">
                <div class="cell"><button type="button" class="name" onClick="{{tm.pick}}"><span class="av">{{tm.init}}</span>{{tm.a}}</button></div>
                <sc-for list="{{tm.cells}}" as="tc" hint-placeholder-count="7">
                  <div class="cell" style="flex-direction: column; align-items: stretch; justify-content: center; gap: 4px">
                    <span style="font-size: 15px; font-weight: 800">{{tc.v}}</span>
                    <span class="tbar"><span style="{{tc.bar}}"></span></span>
                  </div>
                </sc-for>
              </div>
            </sc-for>
          </div>
        </div>
      </section>
    </sc-if>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start">
      <sc-for list="{{werkSecties}}" as="ws" hint-placeholder-count="4">
        <section class="card" style="overflow: hidden">
          <div class="whead">
            <div class="wkop">
              <div class="wkt"><span class="t">{{ws.titel}}</span><span class="s">{{ws.sub}}</span></div>
              <span class="{{ws.todoCls}}"><b>{{ws.todo}}</b> te doen</span>
            </div>
            <sc-if value="{{ws.toonBalk}}" hint-placeholder-val="{{ true }}">
              <div class="wverloop"><span class="tbar"><span style="{{ws.vbar}}; background: #FF8000"></span></span><span><b>{{ws.vpct}}</b> · {{ws.vt}}</span></div>
            </sc-if>
            <sc-if value="{{ws.hasActie}}" hint-placeholder-val="{{ false }}">
              <a class="btn primary" style="min-height: 34px; font-size: 13px; align-self: flex-start" href="{{ws.actie.href}}" title="{{ws.actie.t}}">{{ws.actie.l}}</a>
            </sc-if>
          </div>
          <sc-if value="{{ws.hasItems}}" hint-placeholder-val="{{ true }}">
            <div class="wlist">
              <sc-for list="{{ws.items}}" as="wi" hint-placeholder-count="4">
                <div class="witem">
                  <sc-if value="{{wi.hasTiles}}" hint-placeholder-val="{{ false }}">
                    <span class="tlist"><sc-for list="{{wi.tiles}}" as="tt" hint-placeholder-count="2"><button type="button" class="{{tt.cls}}" title="{{tt.t}}" onClick="{{tt.click}}" onContextMenu="{{tt.menu}}">{{tt.l}}</button></sc-for></span>
                  </sc-if>
                  <sc-if value="{{wi.hasPill}}" hint-placeholder-val="{{ false }}">
                    <span class="tlist"><button type="button" class="{{wi.pillCls}}" title="{{wi.pillT}}" onClick="{{wi.toggle}}" onContextMenu="{{wi.menu}}">{{wi.pillL}}</button></span>
                  </sc-if>
                  <button type="button" class="name" style="flex: 1 1 auto; min-width: 0; text-align: left" onClick="{{wi.open}}">{{wi.naam}}</button>
                  <sc-if value="{{wi.toonAdmin}}" hint-placeholder-val="{{ false }}">
                    <span class="mini">{{wi.admin}}</span>
                  </sc-if>
                  <span style="font-size: 12px; color: #5E5E5E; text-align: right">{{wi.info}}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ws.leegTonen}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 18px 16px; font-size: 14px; color: #5E5E5E">{{ws.leeg}}</div>
          </sc-if>
        </section>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{pageKlanten}}" hint-placeholder-val="{{ true }}">

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 16px">
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 320px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Overzicht</h1>
        <span class="scopetxt">{{scopeTekst}}</span>
      </div>
      <div style="display: inline-flex; gap: 2px; padding: 3px; background: #EAE7E2; border-radius: 9px" role="group" aria-label="Welke klanten">
        <button type="button" class="{{scopeAllCls}}" onClick="{{scopeAll}}">Alle klanten<span class="n">{{scopeAllN}}</span></button>
        <button type="button" class="{{scopeMijnCls}}" onClick="{{scopeMijn}}">Mijn klanten<span class="n">{{scopeMijnN}}</span></button>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #D0CCC6; border-radius: 8px; padding: 0 4px 0 12px; min-height: 42px; font-size: 13px; font-weight: 600; color: #5E5E5E">Collega
        <select aria-label="Filter op collega" value="{{adminF}}" onChange="{{onAdminF}}" style="border: 0; outline: none; font-size: 14px; font-weight: 600; min-height: 40px; background: transparent; color: #2B2B2B">
          <option value="alle">Iedereen</option>
          <option value="Jeroen">JB</option>
          <option value="Gea">GW</option>
          <option value="Marco">MK</option>
          <option value="Yassir">YO</option>
        </select>
      </label>
      <label class="filterbox">Nog open
        <select aria-label="Filter op wat nog open staat" value="{{openF}}" onChange="{{onOpenF}}">
          <sc-for list="{{openOpties}}" as="oo" hint-placeholder-count="5"><option value="{{oo.v}}">{{oo.l}}</option></sc-for>
        </select>
      </label>
      <label style="display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #D0CCC6; border-radius: 8px; padding: 0 12px; min-height: 42px; flex: 0 1 260px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5E5E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="search" placeholder="Zoek klant" aria-label="Zoek klant" value="{{q}}" onChange="{{onQ}}" style="border: 0; outline: none; font-size: 14px; width: 100%; background: transparent; min-height: 40px">
      </label>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="7">
        <button type="button" class="{{k.cls}}" onClick="{{k.pick}}">
          <span style="font-size: 13px; font-weight: 600; color: #5E5E5E">{{k.label}}</span>
          <span style="font-size: 28px; font-weight: 800; line-height: 1.15">{{k.value}}</span>
          <span style="font-size: 12px; color: #5E5E5E">{{k.sub}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

      <section class="card" style="flex: 999 1 620px; min-width: 0; overflow: hidden">
        <div style="display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid #E4E2DF">
          <span style="font-size: 15px; font-weight: 800">{{viewTitle}}</span>
          <span class="infowrap">
            <button type="button" class="infobtn" title="Uitleg afvinken" aria-label="Uitleg afvinken" onClick="{{toggleUitleg}}">i</button>
            <sc-if value="{{toonUitleg}}" hint-placeholder-val="{{ false }}">
              <div class="infopop" onClick="{{noop}}">
                <b style="font-size: 14px">Zo vink je af</b>
        <div class="hulp pop">
          <span class="hstap"><span class="tt o">nov</span><b>klik</b><span class="pijl">→</span><span class="tt d">nov</span>gedaan</span>
          <span class="hstap"><span class="tt d">nov</span><b>nog eens klikken</b><span class="pijl">→</span><span class="tt o">nov</span>weer open</span>
          <span class="hstap"><span class="muis">rechtermuisknop</span><span class="pijl">→</span><span class="tt w">nov</span>wacht op klant</span>
          <span class="hstap"><span class="tt l">nov</span>= achterstand<span class="tt u" style="margin-left: 8px">nov</span>= nu doen</span>
        </div>
                <span style="font-size: 12px; color: #5E5E5E">Eerdere kwartalen klap je open door erop te klikken. Klik op een kolomkop met ⇅ om te sorteren.</span>
              </div>
            </sc-if>
          </span>
          <span style="font-size: 13px; color: #5E5E5E">{{viewCount}}</span>
          <button type="button" class="btn" style="min-height: 34px; font-size: 13px" onClick="{{exportKlanten}}" title="Exporteert precies deze weergave, met filters en sortering">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
            Excel
          </button>
          <div style="flex: 1 1 auto"></div>
          <span style="font-size: 12px; font-weight: 600; color: #5E5E5E">Per collega</span>
          <sc-for list="{{breakdown}}" as="b" hint-placeholder-count="4">
            <button type="button" class="{{b.cls}}" title="{{b.t}}" onClick="{{b.pick}}">{{b.admin}} <b>{{b.n}}</b></button>
          </sc-for>
        </div>
        <div class="verloop">
          <span class="vtitel">{{verloopTitel}}</span>
          <sc-for list="{{verloop}}" as="vl" hint-placeholder-count="3">
            <div class="vitem"><span class="vl">{{vl.l}}</span><span class="tbar"><span style="{{vl.bar}}; background: #FF8000"></span></span><span class="vt"><b>{{vl.pct}}</b> · {{vl.tekst}}</span></div>
          </sc-for>
        </div>
        <div class="tablebox">
          <div class="grid">
            <div class="hcell"><button type="button" class="hbtn" onClick="{{sortBy.naam}}">Klant {{arrow.naam}}</button></div>
            <div class="hcell"><button type="button" class="hbtn" onClick="{{sortBy.admin}}">Adm. {{arrow.admin}}</button></div>
            <div class="hcell sep"><button type="button" class="hbtn" onClick="{{sortBy.btw}}">Lopend kwartaal {{wqLabel}} {{arrow.btw}}</button><div class="hsub">{{wqSub}}</div></div>
            <div class="hcell sep"><sc-if value="{{hasPrevKol}}" hint-placeholder-val="{{ true }}"><span class="hbtn" style="display: inline-flex; align-items: center; cursor: default">{{prevKop}}</span><div class="hsub"><button type="button" class="linkbtn" onClick="{{prevAllesOpen}}">{{prevAllesLabel}}</button></div></sc-if></div>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
              <div class="{{r.cls}}">
                <div class="cell" style="gap: 8px">
                  <button type="button" class="name" style="flex: 1 1 auto; min-width: 0" onClick="{{r.open}}">
                    {{r.naam}}
                    <sc-if value="{{r.hasBijz}}" hint-placeholder-val="{{ false }}">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A94F00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Heeft bijzonderheden"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18v.5"></path></svg>
                    </sc-if>
                  </button>
                  <sc-for list="{{r.tags}}" as="tg" hint-placeholder-count="1"><span class="{{tg.cls}}">{{tg.l}}</span></sc-for>
                </div>
                <div class="cell"><sc-if value="{{r.hasAdmin}}" hint-placeholder-val="{{ true }}"><span class="av" title="{{r.admin}}">{{r.init}}</span></sc-if></div>
                <div class="cell sep">
                  <div class="qb cur"><span class="qbl">{{r.cur.l}}</span><sc-for list="{{r.cur.tiles}}" as="tt" hint-placeholder-count="5"><sc-if value="{{tt.isSep}}" hint-placeholder-val="{{ false }}"><i class="qsep"></i></sc-if><sc-if value="{{tt.isTile}}" hint-placeholder-val="{{ true }}"><button type="button" class="{{tt.cls}}" title="{{tt.t}}" aria-label="{{tt.t}}" disabled="{{tt.na}}" onClick="{{tt.click}}" onContextMenu="{{tt.menu}}">{{tt.l}}</button></sc-if></sc-for></div>
                </div>

                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
                Exporteer naar Excel
              </button>

            <div style="border: 1px solid #E4E2DF; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #FBFAF8">

                  </select>

                <input type="text" value="{{mailS}}" onChange="{{onMailS}}">

              <label class="field">Tekst
                <textarea value="{{mailB}}" onChange="{{onMailB}}" style="min-height: 180px"></textarea>

              <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
                <button type="button" class="btn" onClick="{{copyTxt}}">{{copyTxtLabel}}</button>
                <span style="font-size: 12px; color: #5E5E5E">Mail selectie (BCC) opent Outlook met deze tekst in je standaardlettertype. Wil je Manrope 10: klik op Kopieer tekst en plak die in de mail over de tekst heen.</span>
              </div>
              <sc-if value="{{mailTeLang}}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="background: #FFF2E5; color: #8A3F00; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600">Veel adressen: Outlook kapt lange mail-links soms af. Gebruik dan "Kopieer e-mailadressen" en "Kopieer tekst" en plak ze zelf in een nieuwe mail.</div>

            <div class="kolkeuze">

            </div>
            <div style="overflow-x: auto; border: 1px solid #E4E2DF; border-radius: 10px">
              <div style="{{prevGrid}}">
                <sc-for list="{{prevCells}}" as="pc" hint-placeholder-count="12">
                  <div class="{{pc.cls}}" style="min-height: 40px">{{pc.v}}</div>

              </div>
              <sc-if value="{{selEmpty}}" hint-placeholder-val="{{ false }}">

            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">

                <input type="text" value="{{saveName}}" onChange="{{onSaveName}}" placeholder="Bijv. Herinnering BTW Q3 zonder BK">
              </label>
              <button type="button" class="btn dark" onClick="{{saveView}}">Bewaren</button>
            </div>
            <sc-if value="{{hasSaved}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
                <span style="font-size: 12px; font-weight: 700; color: #5E5E5E">Bewaarde weergaven</span>
                <sc-for list="{{saved}}" as="sv" hint-placeholder-count="2">
                  <button type="button" class="preset" style="border-style: solid" onClick="{{sv.pick}}">{{sv.l}}</button>
                </sc-for>
              </div>
            </sc-if>
          </section>
        </sc-if>

  </sc-if>

  <sc-if value="{{pageJw}}" hint-placeholder-val="{{ false }}">

      </div>
      <label class="filterbox">Van
        <select aria-label="Jaarwerk van" value="{{jwWie}}" onChange="{{onJwWie}}">
          <option value="Jeroen">JB</option>
          <option value="Gea">GW</option>
          <option value="Marco">MK</option>
          <option value="Yassir">YO</option>
          <option value="alle">Iedereen</option>
        </select>
      </label>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">

    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
      <sc-for list="{{jwStat}}" as="js" hint-placeholder-count="3">
        <div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 700; color: #5E5E5E">{{js.l}}</span>
          <span style="display: flex; align-items: baseline; gap: 8px"><b style="font-size: 26px; font-weight: 800">{{js.pct}}</b><span style="font-size: 13px; color: #5E5E5E">{{js.v}} klaar</span></span>
          <span class="tbar" style="height: 8px"><span style="{{js.bar}}; background: #FF8000"></span></span>
        </div>
      </sc-for>
    </div>
    <section class="card" style="overflow: hidden">
      <div style="padding: 10px 16px; border-bottom: 1px solid #E4E2DF; font-size: 13px; color: #5E5E5E; display: flex; align-items: center; gap: 12px">{{jwCount}}
        <button type="button" class="btn" style="min-height: 34px; font-size: 13px" onClick="{{jwExport}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Excel</button>
      </div>
      <sc-for list="{{jwRows}}" as="jr" hint-placeholder-count="5">
        <div class="jwrow">
          <span class="av">{{jr.init}}</span>
          <span class="jwnaam"><button type="button" class="name" style="min-width: 0; text-align: left" onClick="{{jr.open}}">{{jr.naam}}</button><sc-if value="{{jr.hasStatus}}" hint-placeholder-val="{{ false }}"><span class="ntag z">{{jr.status}}</span></sc-if></span>
          <div style="display: flex; gap: 6px">
            <sc-for list="{{jr.tiles}}" as="tt" hint-placeholder-count="3"><button type="button" class="{{tt.cls}} breed" title="{{tt.t}}" disabled="{{tt.na}}" onClick="{{tt.click}}" onContextMenu="{{tt.menu}}">{{tt.l}}</button></sc-for>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{jwLeeg}}" hint-placeholder-val="{{ false }}"><div style="padding: 30px 16px; text-align: center; color: #5E5E5E; font-size: 14px">Niets in deze weergave.</div></sc-if>
    </section>
  </sc-if>
  </main>
</div>
<sc-if value="{{hasMenu}}" hint-placeholder-val="{{ false }}">
  <div class="ctx" style="{{menuPos}}" role="menu" onClick="{{noop}}">
    <div class="ctxt">{{menuTitel}}</div>
    <sc-for list="{{menuItems}}" as="mi" hint-placeholder-count="3">
      <button type="button" role="menuitem" onClick="{{mi.pick}}"><span class="{{mi.dot}}"></span>{{mi.l}}</button>
    </sc-for>
  </div>
</sc-if>
</div>
</sc-if>
